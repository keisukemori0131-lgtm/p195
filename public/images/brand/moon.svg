<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- 灰色の月（名刺の月を写実寄りに）。SVG フィルタで表面の凹凸と海（暗い部分）を描く -->
  <defs>
    <clipPath id="disc">
      <circle cx="300" cy="300" r="296" />
    </clipPath>
    <radialGradient id="base" cx="40%" cy="36%" r="72%">
      <stop offset="0" stop-color="#dededc" />
      <stop offset="0.5" stop-color="#b2b2b0" />
      <stop offset="0.82" stop-color="#7f8081" />
      <stop offset="1" stop-color="#46474a" />
    </radialGradient>
    <radialGradient id="limb" cx="42%" cy="38%" r="62%">
      <stop offset="0.6" stop-color="#000" stop-opacity="0" />
      <stop offset="0.9" stop-color="#05070c" stop-opacity="0.35" />
      <stop offset="1" stop-color="#05070c" stop-opacity="0.7" />
    </radialGradient>
    <filter id="maria" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0075" numOctaves="4" seed="8" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.31  0 0 0 0 0.33  0 0 0 -6 3.25" />
    </filter>
    <filter id="relief" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="5" seed="21" result="t" />
      <feDiffuseLighting in="t" surfaceScale="3.4" lighting-color="#ffffff" result="lit">
        <feDistantLight azimuth="235" elevation="52" />
      </feDiffuseLighting>
      <feColorMatrix in="lit" type="saturate" values="0" />
    </filter>
    <radialGradient id="crater" fx="0.38" fy="0.34">
      <stop offset="0" stop-color="#5d5e61" stop-opacity="0.5" />
      <stop offset="0.65" stop-color="#8a8b8d" stop-opacity="0.2" />
      <stop offset="0.85" stop-color="#f2f2f0" stop-opacity="0.4" />
      <stop offset="1" stop-color="#f2f2f0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <g clip-path="url(#disc)">
    <rect width="600" height="600" fill="url(#base)" />
    <rect width="600" height="600" filter="url(#maria)" opacity="0.9" style="mix-blend-mode:multiply" />
    <rect width="600" height="600" filter="url(#relief)" opacity="0.75" style="mix-blend-mode:overlay" />
    <g fill="url(#crater)">
      <circle cx="372" cy="402" r="34" />
      <circle cx="214" cy="198" r="22" />
      <circle cx="430" cy="236" r="16" />
      <circle cx="262" cy="452" r="14" />
      <circle cx="160" cy="340" r="12" />
      <circle cx="318" cy="128" r="10" />
      <circle cx="476" cy="356" r="11" />
      <circle cx="248" cy="300" r="8" />
      <circle cx="396" cy="168" r="7" />
      <circle cx="180" cy="420" r="9" />
      <circle cx="340" cy="250" r="6" />
      <circle cx="122" cy="246" r="7" />
    </g>
    <rect width="600" height="600" fill="url(#limb)" />
  </g>
</svg>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- favicon は企業ロゴで統一（R4） -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#F1F1EE" />
    <title>株式会社レゴリス｜石狩市の求人コンサル・ホームページ制作・運用</title>
    <meta
      name="description"
      content="求人を出しても応募が来ない、ホームページを更新できていない。石狩・札幌圏の中小企業・店舗の採用と集客を、北海道石狩市の株式会社レゴリスが支えます。求人情報コンサルとホームページ制作・運用「REGOLITH ORBIT」で、自社ジム「101FIT」で試した方法をご提案します。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="株式会社レゴリス｜石狩市の求人コンサル・ホームページ制作・運用" />
    <meta
      property="og:description"
      content="求人を出しても応募が来ない、ホームページを更新できていない。石狩・札幌圏の中小企業・店舗の採用と集客を、北海道石狩市の株式会社レゴリスが支えます。求人情報コンサルとホームページ制作・運用「REGOLITH ORBIT」で、自社ジム「101FIT」で試した方法をご提案します。"
    />
    <meta property="og:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 名刺のデザインに合わせた書体: 欧文ロゴ Barlow（太字）・欧文ラベル Barlow Condensed（DIN 系）・
         欧文セリフ Cormorant Garamond・和文見出し しっぽり明朝 B1・本文 Noto Sans JP。
         Inter / Roboto は使わない（design.ng）。描画をブロックしない読み込み（R10 性能 #3） -->
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800&family=Barlow+Condensed:wght@500;600;700&family=Cormorant+Garamond:wght@500&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Barlow:wght@700;800&family=Barlow+Condensed:wght@500;600;700&family=Cormorant+Garamond:wght@500&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- JS が動く環境でだけスクロールアニメーションを有効にする（クローラー・JS 無効時は即表示） -->
    <script>
      document.documentElement.classList.add('js-ready')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
